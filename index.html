<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GV PORTAL</title>
<style>:root{--bg:#eef0fa;--c1:#fff;--c2:#f6f4ff;--bd:#e4e6f2;--tx:#14142b;--mu:#6b6f8a;--ac:#7b5cf0;--ok:#1a9a52;--bad:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
body.ex{overflow:hidden;height:100%}
h1,h2,h3{margin:0}h3{font-size:14px;color:var(--ac);margin:14px 0 6px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 18px;border-radius:7px;cursor:pointer;font-weight:600}
.btn.o{background:#fff;color:var(--ac);border-color:var(--ac);border:1px solid var(--bd)}.btn.r{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--c1);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top .sp{flex:1}.logo{font-weight:800;letter-spacing:2px;font-size:18px}
.wrap{max-width:1100px;margin:0 auto;padding:26px 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:22px}
.card p{color:var(--mu);margin:6px 0 14px}.prog{color:var(--ok);font-size:13px;margin-bottom:14px}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.lc{background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:14px}
.lc b{font-size:16px}.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin:6px 0 10px;border:1px solid var(--bd)}
.tag.Completed{color:var(--ok);border-color:var(--ok)}.tag.Unlocked{color:var(--ac);border-color:var(--ac)}.tag.InProgress{color:#b7791f;border-color:#b7791f}.tag.Locked{color:var(--mu)}
.lc .btn{width:100%;margin-top:4px}
.ft{text-align:center;color:var(--mu);font-size:13px;padding:20px}
.login{max-width:380px;margin:9vh auto;padding:30px}
.login label{display:block;margin:14px 0 5px;color:var(--mu);font-size:13px}
.login input{width:100%;padding:10px 12px;background:var(--c2);border:1px solid var(--bd);border-radius:7px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:5px;background:none;border:0;cursor:pointer;color:var(--mu)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.exam{height:100vh;display:flex;flex-direction:column}
.split{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:0}
.pl{overflow:auto;padding:16px 20px;border-right:1px solid var(--bd)}
.pr{display:flex;flex-direction:column;min-height:0;padding:12px;gap:8px;overflow:hidden}
pre{margin:0;background:var(--c2);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;font:13px Consolas,"Courier New",monospace;white-space:pre-wrap;overflow-x:auto}
.ed{flex:1;display:flex;min-height:170px;position:relative;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--c2)}
.ed pre{border:0;border-radius:0;background:#f1eefc;color:var(--mu);text-align:right;overflow:hidden;white-space:pre;min-width:38px}
.ed textarea{flex:1;border:0;background:transparent;resize:none;outline:0;padding:8px 10px;font:13px/1.5 Consolas,"Courier New",monospace;white-space:pre;overflow:auto;tab-size:4}
.ed pre{line-height:1.5;padding:8px 8px}
.ac{position:absolute;left:46px;bottom:6px;background:#fff;border:1px solid var(--bd);border-radius:7px;display:none;z-index:4;min-width:160px;font:13px Consolas,monospace}
.ac div{padding:4px 12px;cursor:pointer}.ac .on{background:var(--ac);color:#fff}
.bot{max-height:42%;overflow:auto;display:flex;flex-direction:column;gap:6px}
.bot textarea{width:100%;height:56px;background:var(--c2);border:1px solid var(--bd);border-radius:7px;padding:6px 8px;font:13px Consolas,monospace}
.tc{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;margin:4px 0;font-size:13.5px;background:var(--c1)}
.p{color:var(--ok);font-weight:700}.f{color:var(--bad);font-weight:700}
.tabs{display:flex;gap:6px}.tabs button{background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer}.tabs .on{background:var(--ac);color:#fff}
.mod{position:fixed;inset:0;background:rgba(20,20,43,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:22px;max-width:420px}.mb{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.res{background:#fff;color:#000;border-radius:12px;padding:28px;max-width:640px;margin:30px auto;border-left:8px solid var(--bad)}
.res.ok{border-left-color:var(--ok)}.res h2,.res p,.res b{color:#000}.res .big{font-size:34px;font-weight:800}
.res .btn.o{color:#000;border-color:#999}
.warn{background:#fff7e0;border:1px solid #f0c14b;color:#6b4e00;border-radius:8px;padding:10px 14px;margin-top:14px;font-size:13.5px}
.fld{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px;margin:5px 0;font-size:13px;align-items:center}
.fld input,.fld select{background:var(--c2);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
.given{background:var(--c2);border-radius:7px;padding:8px 10px;margin:8px 0;font-size:14px}
iframe{flex:1;width:100%;border:1px solid var(--bd);border-radius:8px;background:#fff;min-height:200px}
@media(max-width:860px){.split{grid-template-columns:1fr;overflow:auto}.exam{height:auto;min-height:100vh}body.ex{overflow:auto}}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/JSCPP@2.0.6/dist/JSCPP.es5.min.js"></script>
<script>
const num=s=>s.trim().split(/\s+/).map(Number);
const rd=x=>{let r=0;while(x>9){r=0;while(x>0){r+=x%10;x=Math.floor(x/10)}x=r}return x};
const pf=n=>{let s=0;for(let p=2;p<=n;p++)while(n%p===0){s+=p;n/=p}return s};
const rom=n=>{const m=[[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[v,t]of m)while(n>=v){r+=t;n-=v}return r};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const isP=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
const tri=(n,f)=>{if(n<=0)return"Invalid";let k=1,o=[];for(let i=1;i<=n;i++){let r=[];for(let j=0;j<i;j++)r.push(k++);o.push(r.join(" "))}return o.join("\n")};
const lp=y=>y%400===0||(y%4===0&&y%100!==0);
const pal=n=>{const t=String(n);return t===[...t].reverse().join("")};
const rows=(n,fn)=>{const o=[];for(let i=1;i<=n;i++)o.push(fn(i));return o.join("\n")};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const Q=[
{t:"Fibonacci Series",sc:"A teacher wants to show students how the Fibonacci series grows. The first two terms are 0 and 1, and each next term is the sum of the previous two.",task:"Write a program that reads a positive integer n and prints the first n Fibonacci numbers, each followed by a comma. If n is not positive, print invalid input.",con:["-100 ≤ n ≤ 40","Print all numbers on one line, no spaces"],s:"5",h:["4","7","-1","11","20"],f:x=>{const n=+x;if(n<=0)return"invalid input";let a=0,b=1,o="";for(let i=0;i<n;i++){o+=a+",";[a,b]=[b,a+b]}return o}},
{t:"Prime or Composite Number",sc:"Alex finds an ancient book that opens only when a number is identified correctly as prime or composite.",task:"Read an integer n and print whether it is a prime or a composite number, in the format shown in the samples.",con:["2 ≤ n ≤ 100000","Output format: N is a prime number / N is a composite number"],s:"7",h:["15","50","29","97","121"],f:x=>{const n=+x;let p=n>1;for(let i=2;i*i<=n;i++)if(n%i===0)p=false;return n+(p?" is a prime number":" is a composite number")}},
{t:"Abundant Number",sc:"In Mathville, Alex hunts for abundant numbers, whose proper divisors add up to more than the number itself.",task:"Read an integer n. Add all its proper divisors (excluding n). If the sum is greater than n print 'n is an abundant number', otherwise print 'n is not an abundant number'.",con:["1 ≤ n ≤ 100000"],s:"12",h:["18","13","24","16","30"],f:x=>{const n=+x;let s=0;for(let i=1;i<n;i++)if(n%i===0)s+=i;return n+(s>n?" is an abundant number":" is not an abundant number")}},
{t:"Harmonic Series",sc:"A program must add the harmonic series 1 + 1/2 + 1/3 + ... up to the n-th term.",task:"Read a positive integer n and print the sum of the harmonic series up to n with 2 decimal places. If n is not positive, print invalid input.",con:["-100 ≤ n ≤ 1000","Use floating point division"],s:"10",h:["4","5","24","61","-2"],f:x=>{const n=+x;if(n<=0)return"invalid input";let s=0;for(let i=1;i<=n;i++)s+=1/i;return s.toFixed(2)}},
{t:"Digits Count",sc:"A calculator company wants to show how many digits a number has.",task:"Read an integer (it may be negative or zero) and print the number of digits in it. Use a loop.",con:["-10^9 < n < 10^9","0 has 1 digit; ignore the minus sign"],s:"47580",h:["78562453","4521","-2578963","0","-36528000"],f:x=>String(Math.abs(+x)).length+""},
{t:"Pyramid Pattern",sc:"Users enter the number of rows and expect a triangle of consecutive numbers starting from 1.",task:"Read the number of rows and print a pyramid where row i has i numbers, continuing from 1. For 0 or negative input print invalid.",con:["-10 ≤ rows ≤ 20","Numbers in a row are separated by a single space"],s:"4",h:["3","2","0","5","6"],f:x=>tri(+x)},
{t:"Perfect Cubes",sc:"A maths enthusiast wants the cubes of three consecutive numbers starting from a given number.",task:"Read an integer n. If n is positive, print the cubes of n, n+1 and n+2, each on a new line. Otherwise print invalid.",con:["-100 ≤ n ≤ 1000"],s:"10",h:["4","1","0","7","15"],f:x=>{const n=+x;return n<=0?"Invalid":[n,n+1,n+2].map(v=>v**3).join("\n")}},
{t:"Roman Numerals",keep:1,sc:"A user interface must convert small numbers into Roman numerals.",task:"Read an integer and print its Roman numeral. Reference: I-1, IV-4, V-5, IX-9, X-10, XL-40. If the number is below 1 or above 40, print invalid input.",con:["-100 ≤ n ≤ 100"],s:"37",h:["16","9","40","-7","12"],f:x=>{const n=+x;return n<1||n>40?"invalid input":rom(n)}},
{t:"Strong Number",sc:"A mathematician notices that some numbers equal the sum of the factorials of their digits.",task:"Read an integer n. If the sum of factorials of its digits equals n print 'n is a strong number', otherwise print 'n is not a strong number'",con:["1 ≤ n ≤ 100000"],s:"123",h:["345","2567","145","45908","40585"],f:x=>{const n=+x,F=[1,1,2,6,24,120,720,5040,40320,362880];const s=String(n).split("").reduce((a,d)=>a+F[+d],0);return n+(s===n?" is a strong number":" is not a strong number")}},
{t:"LCM Finder",sc:"A developer needs the least common multiple of two numbers.",task:"Read two integers. If any of them is negative print negative input, otherwise print their LCM.",con:["-1000 ≤ a, b ≤ 1000","a and b are given on one line"],s:"12 18",h:["45 1","45 4","5 4","5 7","-1 -2"],f:x=>{const[a,b]=num(x);return a<0||b<0?"negative input":String(a*b/gcd(a,b))}},
{t:"Digit Summation",sc:"Milo keeps adding the digits of a number until only one digit is left.",task:"Read an integer and repeatedly sum its digits until the sum becomes a single digit. Print that digit.",con:["1 ≤ n ≤ 10^9"],s:"9876",h:["631","440","913","66","8456"],f:x=>String(rd(+x))},
{t:"Handshake Simulation",sc:"At a conference every person shakes hands with every other person exactly once.",task:"Read the number of people and print the total number of handshakes.",con:["1 ≤ n ≤ 1000"],s:"6",h:["8","22","15","20","45"],f:x=>{const n=+x;return String(n*(n-1)/2)}},
{t:"Sum of All Prime Factors",sc:"An analyst wants to add all the prime factors of financial figures.",task:"Read an integer n and print the sum of its prime factors. A repeated prime factor is added each time it divides n (36 = 2×2×3×3, so the sum is 10).",con:["2 ≤ n ≤ 100000"],s:"36",h:["102","46","160","78","22"],f:x=>String(pf(+x))},
{t:"Smallest 5 Primes Greater Than N",sc:"At a village fair, children win a prize if they pick a prime number.",task:"Read an integer n and print the 5 smallest prime numbers greater than n, each on a new line.",con:["1 ≤ n ≤ 10000"],s:"10",h:["99","20","46","132","75"],f:x=>{let o=[];for(let k=+x+1;o.length<5;k++)if(isP(k))o.push(k);return o.join("\n")}},
{t:"Series Sum Calculator",sc:"A maths platform shows a series built by repeating a digit, such as 3 + 33 + 333.",task:"Read a digit d and the number of terms n. Print the series (terms separated by ' + ') on the first line and its sum on the second line.",con:["1 ≤ d ≤ 9","1 ≤ n ≤ 8"],s:"3 4",h:["2 5","1 6","9 2","7 4","6 4"],f:x=>{const[d,n]=num(x);let t=[],sm=0;for(let i=1;i<=n;i++){t.push(String(d).repeat(i));sm+=+String(d).repeat(i)}return t.join(" + ")+"\n"+sm}},
{t:"Divisor Sum and Equality Checker",sc:"A mysterious code lists the divisors of a number and checks if their sum equals the number.",task:"Read n. Print its proper divisors (excluding n) separated by spaces, then their sum, then 'n is an equal number' or 'n is not an equal number'.",con:["2 ≤ n ≤ 10000"],s:"42",h:["28","25","496","16","78"],f:x=>{const n=+x;let d=[];for(let i=1;i<n;i++)if(n%i===0)d.push(i);const sm=d.reduce((a,b)=>a+b,0);return d.join(" ")+"\n"+sm+"\n"+n+(sm===n?" is an equal number":" is not an equal number")}},
{t:"Geometric Series Sum",sc:"John adds the series 1 + 1/2 + 1/4 + 1/8 + ... where each term is half of the previous term.",task:"Read N and print the sum of the first N terms with 2 decimal places. For negative N print 0.00.",con:["-100 ≤ N ≤ 50"],s:"6",h:["4","3","7","-7","12"],f:x=>{const n=+x;if(n<0)return"0.00";let s=0,t=1;for(let i=0;i<n;i++){s+=t;t/=2}return s.toFixed(2)}},
{t:"Sum of Squares of N Natural Numbers",sc:"A program must add the squares of 1, 2, 3 ... up to N.",task:"Read a positive integer N and print 1² + 2² + ... + N². If N is 0 or negative print invalid input.",con:["-100 ≤ N ≤ 1000"],s:"5",h:["25","12","21","72","-5"],f:x=>{const n=+x;if(n<=0)return"invalid input";let s=0;for(let i=1;i<=n;i++)s+=i*i;return String(s)}},
{t:"Swap the Digits",sc:"Tom wants to swap the first and last digits of a number.",task:"Read a positive integer and print the number after swapping its first and last digits.",con:["10 ≤ n ≤ 10^9","The last digit is never 0 after the swap rule is applied to the given tests"],s:"12345",h:["258714","428571","571428","857142","109876"],f:x=>{const a=x.trim().split("");[a[0],a[a.length-1]]=[a[a.length-1],a[0]];return a.join("")}},
{t:"Sum of Odd and Even Numbers up to N",sc:"Tom practices loops by adding odd and even numbers separately.",task:"Read n. Print the sum of all odd numbers from 1 to n on the first line and the sum of all even numbers from 1 to n on the second line.",con:["1 ≤ n ≤ 1000"],s:"5",h:["8","4","7","15","30"],f:x=>{const n=+x;let o=0,e=0;for(let i=1;i<=n;i++)i%2?o+=i:e+=i;return o+"\n"+e}},
{t:"Narcissistic Numbers",sc:"Alice studies numbers equal to the sum of their digits each raised to the number of digits.",task:"Read n. Print 'n is a narcissistic number' or 'n is not a narcissistic number'.",con:["0 ≤ n ≤ 100000"],s:"153",h:["1","370","42","1634","12"],f:x=>{const n=+x,d=String(n).split("").map(Number);return n+(d.reduce((a,b)=>a+b**d.length,0)===n?" is a narcissistic number":" is not a narcissistic number")}},
{t:"Digit Sum Calculator",sc:"Tom wants the sum of the even digits and the sum of the odd digits of a number.",task:"Read an integer (up to 10 digits). Use a while loop. Print the sum of even digits on the first line and the sum of odd digits on the second line.",con:["1 ≤ n ≤ 10^9"],s:"123456",h:["86953","37159","45987","768543","529032959"],f:x=>{let e=0,o=0;for(const c of x.trim()){const d=+c;d%2?o+=d:e+=d}return e+"\n"+o}},
{t:"Sum of First and Last Digit",sc:"A calculator needs a quick integrity check using the first and last digit of a number.",task:"Read a number and print the sum of its first and last digits.",con:["10 ≤ n ≤ 10^9"],s:"78956",h:["45126","98745","7562","9999","45623"],f:x=>{const t=x.trim();return String(+t[0]+ +t[t.length-1])}},
{t:"Fibonacci Even Number Generator",sc:"Jack wants only the even numbers of the Fibonacci sequence up to a limit.",task:"Read a limit and print the even Fibonacci numbers (starting from 0) that are less than or equal to the limit, separated by spaces. For 0 or a negative limit print invalid.",con:["-100 ≤ limit ≤ 100000"],s:"5",h:["40","150","-2","2600","11000"],f:x=>{const n=+x;if(n<=0)return"Invalid";let a=0,b=1,o=[];while(a<=n){if(a%2===0)o.push(a);[a,b]=[b,a+b]}return o.join(" ")}},
{t:"Odd or Even Numbers Series",sc:"A teacher prints a series of odd or even numbers depending on the limit.",task:"Read a limit. If the limit is odd print all odd numbers up to it, if even print all even numbers up to it, separated by spaces. If the limit is 0 or negative print not a positive integer.",con:["-100 ≤ limit ≤ 1000"],s:"9",h:["7","8","15","18","-4"],f:x=>{const n=+x;if(n<=0)return"not a positive integer";let o=[];for(let i=n%2?1:2;i<=n;i+=2)o.push(i);return o.join(" ")}},
{t:"Vowel Counter",sc:"A developer counts the vowels in a word.",task:"Read a single word (no spaces) and print the number of vowels (a, e, i, o, u in upper or lower case) in it.",con:["1 ≤ length ≤ 50","The word contains only letters"],s:"Bestfriends",h:["PersonalizedSkill","PSTeam","PSHeadquarters","helloworld","waterbottle"],f:x=>String((x.match(/[aeiou]/gi)||[]).length)},
{t:"Harshad Number",sc:"Students check numbers that are divisible by the sum of their digits.",task:"Read n. Print 'n is harshad number' if n is divisible by the sum of its digits, otherwise print 'n is not harshad number'",con:["1 ≤ n ≤ 100000"],s:"18",h:["25","12","36","51","21"],f:x=>{const n=+x,sm=String(n).split("").reduce((a,b)=>a+ +b,0);return n+(n%sm===0?" is harshad number":" is not harshad number")}},
{t:"Leap and Non-Leap Years",sc:"Friends want to know if a year is a leap year and how many leap years follow it.",task:"Read a year. Print 'Y is a leap year' or 'Y is not a leap year'. Then print 'leap years: L' and 'non-leap years: N' for the 10 years after the given year (year+1 to year+10).",con:[],s:"2022",s2:"2020",h:["2024","2010","2100","1996","2018"],f:x=>{const y=+x;const L=range(y+1,y+10).filter(lp).length;return y+(lp(y)?" is a leap year":" is not a leap year")+"\nleap years: "+L+"\nnon-leap years: "+(10-L)}},
{t:"Square Pattern",sc:"Alice prints a square of # characters for a visual project.",task:"Read the size of the square and print it using '#' separated by spaces. If the size is less than 1 print 'N is invalid input' (N is the number given).",con:[],s:"3",s2:"-10",h:["6","5","0","-5","2"],f:x=>{const n=+x;return n<1?n+" is invalid input":rows(n,()=>Array(n).fill("#").join(" "))}},
{t:"Alphabet Triangle Generator",keep:1,sc:"Children build a triangle from alphabet blocks.",task:"Read the number of rows N. Print N rows where row i has the i-th letter (A, B, C, ...) repeated i times. If N is 0 or negative print invalid.",con:[],s:"3",s2:"0",h:["2","4","-3","5","6"],f:x=>{const n=+x;return n<=0?"invalid":rows(n,i=>String.fromCharCode(64+i).repeat(i))}},
{t:"Finding the Next Palindrome",sc:"Sarah looks for the next palindromic number after a given number.",task:"Read an integer and print the smallest palindrome number greater than it.",con:[],s:"123",h:["1234","5432","999","600","1120"],f:x=>{let n=+x+1;while(!pal(n))n++;return String(n)}},
{t:"Consecutive Palindromic Numbers",sc:"Alice generates palindromic numbers starting from a given number.",task:"Read a starting number and print the next five palindromic numbers (the start itself counts if it is a palindrome), separated by spaces.",con:[],s:"10",s2:"99",h:["500","11","12345","777","650"],f:x=>{let n=+x,o=[];while(o.length<5){if(pal(n))o.push(n);n++}return o.join(" ")}},
{t:"Palindromic Right-Angled Triangle",sc:"John prints a triangle whose rows go up and then come back down.",task:"Read the number of rows N. Row i prints i ascending numbers (continuing the counter from the previous row) followed by the same numbers descending without repeating the last one. For N of 0 or less print invalid.",con:[],s:"4",s2:"-4",h:["2","3","0","5","6"],f:x=>{const n=+x;if(n<=0)return"invalid";let k=1;return rows(n,i=>{const a=[];for(let j=0;j<i;j++)a.push(k++);return a.concat(a.slice(0,-1).reverse()).join(" ")})}},
{t:"The Palindromic Sum",sc:"Alice adds all palindromic numbers up to a limit.",task:"Read a positive integer n and print the sum of all palindrome numbers from 1 to n.",con:[],s:"10",s2:"99",h:["19","36","95","150","70"],f:x=>{let t=0;for(let i=1;i<=+x;i++)if(pal(i))t+=i;return String(t)}},
{t:"Multiples of 5 Pattern",sc:"A program prints rows of multiples of 5 that grow with each row.",task:"Read the number of rows. Row i prints 5, 10, ... up to i multiples of 5. If rows is less than 1 print invalid.",con:[],s:"4",s2:"-5",h:["3","5","7","-8","1"],f:x=>{const n=+x;return n<1?"invalid":rows(n,i=>range(1,i).map(v=>v*5).join(" "))}},
{t:"Squares of Even or Odd Numbers",sc:"A program prints squares depending on whether the input is even or odd.",task:"Read an integer. If it is even print the squares of all even numbers up to it, if odd print the squares of all odd numbers up to it, separated by spaces.",con:[],s:"6",s2:"11",h:["7","12","9","21","8"],f:x=>{const n=+x,o=[];for(let i=n%2?1:2;i<=n;i+=2)o.push(i*i);return o.join(" ")}},

 E:E.map((p,j)=>({n:n++,db:dbs[(j+1)%2],given:["Inventor: "+p[2],"Publication date: "+p[1],"Hint: Patent about "+p[3]+"."],f:[dn,ap,at,st]}))}}
function newIprSet(){P.ipr={ans:{},done:false,set:genIpr(),id:Math.floor(1000+Math.random()*9000),tab:"G",sec:"A"};save()}
function rIpr(){if(!P.ipr.set)newIprSet();let cur=P.ipr.tab||"G",sec=P.ipr.sec||"A";const S=P.ipr.set,IQ=[...S.B,...S.C,...S.D,...S.E];
 const ans=P.ipr.ans,done=q=>q.f.every((f,i)=>ans["q"+q.n+"_"+i]),ks=Object.keys(D);
 const qh=q=>'<div class="given"><b>'+q.n+']</b> '+q.given.map(esc).join("<br>")+'<br><i>Database: '+D[q.db][0]+'</i>'+q.f.map((f,i)=>{const k="q"+q.n+"_"+i,v=esc(ans[k]||"");return'<div class="fld"><label>'+esc(f[0])+'</label>'+(f[1]==="s"?'<select data-k="'+k+'"><option value="">Select</option>'+["FILED","PUBLISHED","GRANTED"].map(o=>'<option'+(ans[k]===o?" selected":"")+'>'+o+'</option>').join("")+'</select>':'<input data-k="'+k+'" data-t="'+f[1]+'" value="'+v+'" autocomplete="off">')+'</div>'}).join("")+'</div>';
 const body=sec==="A"?'<h2>Section A – Patent Search Websites</h2><p style="color:var(--mu)">Use the database named in each question. Open a site on the right, then answer Sections B to E.</p><div class="lv">'+ks.map((k,i)=>'<div class="lc"><b>'+D[k][0]+'</b><p style="color:var(--mu);font-size:13px;margin:6px 0 10px">'+esc(tools[i][2])+'</p><button class="btn" data-d="'+k+'">Open on right</button></div>').join("")+'</div>':'<h2>Section '+sec+'</h2>'+S[sec].map(qh).join("");
 app.innerHTML='<div class="exam"><div class="top"><span class="logo">GV PORTAL</span><span>IPR PATENT SEARCH</span><span id="cnt" style="color:var(--mu)"></span><div class="sp"></div><button class="btn o" id="nq">New Question Set</button><button class="btn o" id="ex">Save &amp; Exit</button><button class="btn r" id="fin">Finish Test</button></div><div class="split"><div class="pl"><div class="tabs" style="margin-bottom:12px;flex-wrap:wrap">'+["A","B","C","D","E"].map(x=>'<button data-s="'+x+'" class="'+(x===sec?"on":"")+'">Section '+x+'</button>').join("")+'</div>'+body+foot+'</div>'+
 '<div class="pr"><div class="tabs">'+ks.map(k=>'<button data-d="'+k+'" class="'+(k===cur?"on":"")+'">'+D[k][0]+'</button>').join("")+'</div><div class="warn" style="margin:0">If the page stays blank, the site blocks embedding. Use the link to open it in a new tab. Your answers stay saved here. <a target="_blank" rel="noopener" href="'+D[cur][1]+'" style="color:#6b4e00">Open '+D[cur][0]+' ↗</a></div><iframe id="fr" src="'+D[cur][1]+'" referrerpolicy="no-referrer"></iframe></div></div></div>';
 const cnt=()=>{$("cnt").textContent="Set #"+P.ipr.id+" · "+IQ.filter(done).length+" / "+IQ.length+" answered"};cnt();
 app.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{if(el.dataset.t==="u")el.value=el.value.toUpperCase();ans[el.dataset.k]=el.value;save();cnt()}));
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{P.ipr.tab=b.dataset.d;save();rIpr()});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{P.ipr.sec=b.dataset.s;save();rIpr();const p=app.querySelector(".pl");if(p)p.scrollTop=0});
 $("ex").onclick=()=>go("home");
 $("nq").onclick=()=>modal("Generate a new set of questions? Current answers will be cleared.",[["Cancel",null,"o"],["New Question Set",()=>{newIprSet();rIpr()},"r"]]);
 $("fin").onclick=()=>modal("Finish the IPR Patent Search test? Answers are saved. Auto-grading is not available because no answer key was supplied.",[["Continue Test",null,"o"],["Finish Test",()=>{P.ipr.done=true;save();go("home")},"r"]])}
// ===== start =====
try{const s=localStorage.getItem("gvp_session");if(s===USER){U=s;load();V="home"}}catch(e){}
render();

</script></body></html>
